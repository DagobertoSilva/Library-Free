services:
  postgres:
    image: postgres:16
    container_name: libraryfree-db
    restart: always
    environment:
      POSTGRES_DB: libraryfree_db
      POSTGRES_USER: libraryfree_user
      POSTGRES_PASSWORD: libraryfree_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libraryfree_user -d libraryfree_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libraryfree-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/libraryfree_db
      SPRING_DATASOURCE_USERNAME: libraryfree_user
      SPRING_DATASOURCE_PASSWORD: libraryfree_password
      API_SECURITY_TOKEN_SECRET: "27fbb44da81ebe00ce8ec510c794587e92f805aaac3d0478169fe030ff6f6380" 
      API_SECURITY_TOKEN_ISSUER: "library-free-api"
      
volumes:
  postgres_data: