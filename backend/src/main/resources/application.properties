spring.application.name=Library Free

# No Docker: usa a variável de ambiente, local usa o valor padrão 'localhost:5432/libraryfree_db'
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/libraryfree_db}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:libraryfree_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:libraryfree_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.security.token.secret=${API_SECURITY_TOKEN_SECRET:27fbb44da81ebe00ce8ec510c794587e92f805aaac3d0478169fe030ff6f6380}
api.security.token.issuer=${API_SECURITY_TOKEN_ISSUER:library-free-api}