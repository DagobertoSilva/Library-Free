<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Free | Cadastro de Livros</title>
    <link rel="icon" href="../img/book.svg" type="image/svg+xml">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <style>
        /* Ajustes específicos para os Dropdowns Customizados */
        .dropdown-menu { max-height: 250px; overflow-y: auto; }
        .selected-tag { font-size: 0.85rem; }
        
        /* Garante que o dropdown pareça um input do seu tema */
        .dropdown-toggle {
            background-color: #fff;
            border: 1px solid #ced4da;
            text-align: left;
        }
        
        /* Ajuste para manter consistência visual com inputs focados */
        .form-control:focus {
            box-shadow: none;
            border-color: #02542D;
        }
    </style>
</head>

<body>
    <header class="container">
        <nav>
            <ul class="menu-list">
                <li><a href="./books.html" class="menu-item active text">Livros</a></li>
                <li><a href="./users.html" class="menu-item text">Alunos</a></li>
                <li><a href="./emprestimos.html" class="menu-item text">Empréstimos</a></li>
                <li><a href="#" class="menu-item exit">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="title">Cadastro de Livros</h1>
        <h2 class="subtitle">Library Free</h2>
    </main>

    <section class="container">
        <form id="bookRegisterForm" class="mt-4">
            
            <div class="row g-3 mb-3">
                <div class="col-md-8">
                    <label for="title" class="form-label">Título *</label>
                    <input type="text" class="form-control" id="title" name="titulo" placeholder="Ex: Dom Casmurro" required>
                </div>
                <div class="col-md-4">
                    <label for="isbn" class="form-label">ISBN</label>
                    <input type="text" class="form-control" id="isbn" name="isbn" maxlength="17" placeholder="Ex: 978-8576082675">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Autores</label>
                    <div class="dropdown" id="dropdown-autores">
                        <div class="form-control d-flex flex-wrap align-items-center gap-1 dropdown-toggle" 
                             type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="min-height: 38px;">
                            <span class="text-muted placeholder-text">Selecione...</span>
                            <div class="selected-container d-flex flex-wrap gap-1"></div>
                        </div>
                        <ul class="dropdown-menu w-100 shadow">
                            <li class="p-2 border-bottom sticky-top bg-light">
                                <button class="btn btn-sm btn-outline-success w-100 btn-create-new">
                                    + Novo Autor
                                </button>
                            </li>
                            <div class="list-container p-1"></div>
                        </ul>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Gêneros</label>
                    <div class="dropdown" id="dropdown-generos">
                        <div class="form-control d-flex flex-wrap align-items-center gap-1 dropdown-toggle" 
                             type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" style="min-height: 38px;">
                            <span class="text-muted placeholder-text">Selecione...</span>
                            <div class="selected-container d-flex flex-wrap gap-1"></div>
                        </div>
                        <ul class="dropdown-menu w-100 shadow">
                            <li class="p-2 border-bottom sticky-top bg-light">
                                <button class="btn btn-sm btn-outline-success w-100 btn-create-new">
                                    + Novo Gênero
                                </button>
                            </li>
                            <div class="list-container p-1"></div>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Editora</label>
                    <div class="dropdown" id="dropdown-editora">
                        <div class="form-control d-flex align-items-center justify-content-between dropdown-toggle" 
                             type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="text-muted placeholder-text">Selecione...</span>
                            <span class="selected-value fw-bold d-none"></span>
                        </div>
                        <ul class="dropdown-menu w-100 shadow">
                            <li class="p-2 border-bottom sticky-top bg-light">
                                <button class="btn btn-sm btn-outline-success w-100 btn-create-new">
                                    + Nova Editora
                                </button>
                            </li>
                            <div class="list-container p-1"></div>
                        </ul>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="date" class="form-label">Data de Publicação</label>
                    <input type="number" class="form-control" id="date" name="anoPublicacao" placeholder="Ano (ex: 2024)" min="1500">
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label for="copies" class="form-label">Quantidade de Exemplares *</label>
                    <input type="number" class="form-control" id="copies" name="quantidadeTotal" min="1" value="1" required>
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-end mb-5">
                <button type="submit" class="btn btn-success" style="border: none; padding: 10px 24px; cursor: pointer;">Salvar</button>
                
                <button type="button" class="btn btn-warning" onclick="window.history.back()" style="border: none; padding: 10px 24px; cursor: pointer;">Cancelar</button>
            </div>
        </form>
    </section>

    <footer class="footer">
        <div class="copyright">
            <p>© Copyright - 2005</p>
            <p>Library Free - Open Source</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
        
    <script type="module" src="../javascript/main.js"></script>
    <script type="module" src="../javascript/pages/register-book.js"></script>
</body>
</html>
