<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Free | Editar Livro</title>
    <link rel="icon" href="../img/book.svg" type="image/svg+xml"">
    <link href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="container">
        <nav>
            <ul class="menu-list">
                <li><a href="./home.html" class="menu-item home" aria-label="Página inicial"><img src="../img/home.svg"
                            alt=""></a></li>
                <li><a href="./books.html" class="menu-item text">Livros</a></li>
                <li><a href="./users.html" class="menu-item text">Alunos</a></li>
                <li><a href="#" class="menu-item exit">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="title">Edição de Livros</h1>
        <h2 class="subtitle">Library Free</h2>
    </main>
    <section class="container">
        <form id="bookEditForm" class="book-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Título">
                </div>
                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" placeholder="ISBN" readonly>
                </div>
                <div class="form-group">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" placeholder="Autor">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="genero">Gênero</label>
                    <input type="text" id="genero" placeholder="Gênero">
                </div>
                <div class="form-group">
                    <label for="edicao">Edição</label>
                    <input type="text" id="edicao" placeholder="Edição">
                </div>
                <div class="form-group">
                    <label for="dataPublicacao">Data de publicação</label>
                    <input type="date" id="dataPublicacao" placeholder="Data da publicação">
                </div>
                <div class="form-group">
                    <label for="editora">Editora</label>
                    <input type="text" id="editora" placeholder="Editora">
                </div>
            </div>
            <div class="form-footer">
                <div class="form-group form-group-small">
                    <label for="exemplares">Quantidade de Exemplares</label>
                    <input type="number" id="exemplares" placeholder="Qtd. Exemplares" min="1">
                </div>
                <div class="form-actions" style="margin-top: 0;">
                    <button type="submit" class="btn-positive">Salvar</button>
                    <button type="button" class="btn-warning" onclick="window.history.back()">Cancelar</button>
                </div>
            </div>
        </form>
    </section>
    <footer class="footer">
        <div class="copyright">
            <p>© Copyright - 2005</p>
            <p>Library Free - Open Source</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
<script type="module" src="../javascript/main.js"></script>
<script type="module" src="../javascript/pages/edit-book.js"></script>
</body>

</html>
