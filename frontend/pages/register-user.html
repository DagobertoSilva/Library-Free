<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Free | Cadastro de Alunos</title>
    <link rel="icon" href="../img/book.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

    <style>
        /* Dropdown Customizado */
        .dropdown-menu { max-height: 250px; overflow-y: auto; }
        .selected-tag { font-size: 0.85rem; }
        
        .dropdown-toggle {
            background-color: #fff;
            border: 1px solid #ced4da;
            text-align: left;
        }
        
        .form-control:focus {
            box-shadow: none;
            border-color: #02542D;
        }
    </style>
</head>

<body>
    <header class="container">
        <nav>
            <ul class="menu-list">
                <li><a href="./books.html" class="menu-item text">Livros</a></li>
                <li><a href="./users.html" class="menu-item active text">Alunos</a></li>
                <li><a href="./emprestimos.html" class="menu-item text">Empréstimos</a></li>
                <li><a href="#" class="menu-item exit">Sair</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <h1 class="title">Cadastro de Alunos</h1>
        <h2 class="subtitle">Library Free</h2>
    </main>
    
    <section class="container">
        <form id="userRegisterForm" class="mt-4">
            
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome *</label>
                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: João Silva" required>
                </div>
                <div class="col-md-6">
                    <label for="matricula" class="form-label">Matrícula *</label>
                    <input type="text" class="form-control" id="matricula" name="matricula" placeholder="Ex: 2025001" maxlength="20" required>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="curso-select" class="form-label">Curso *</label>
                    <select id="curso-select" class="form-select" required>
                        <option value="">Selecione um curso</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Turma *</label>
                    <div class="dropdown" id="dropdown-turma">
                        <div class="form-control d-flex align-items-center justify-content-between dropdown-toggle" 
                             type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="text-muted placeholder-text">Selecione...</span>
                            <span class="selected-value fw-bold d-none"></span>
                        </div>
                        <ul class="dropdown-menu w-100 shadow">
                            <div class="list-container p-1"></div>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-end mb-5">
                <button type="submit" class="btn btn-success" style="border: none; padding: 10px 24px; cursor: pointer;">Salvar</button>
                <button type="button" class="btn btn-warning" onclick="window.history.back()" style="border: none; padding: 10px 24px; cursor: pointer;">Cancelar</button>
            </div>
        </form>
    </section>

    <footer class="footer">
        <div class="copyright">
            <p>© Copyright - 2005</p>
            <p>Library Free - Open Source</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
        
    <script type="module" src="../javascript/main.js"></script>
    <script type="module" src="../javascript/pages/register-user.js"></script>
</body>

</html>
