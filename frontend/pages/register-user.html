<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Free | Criar Aluno</title>
    <link rel="icon" href="../img/book.svg" type="image/svg+xml"">
    <link href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="container">
        <nav>
            <ul class="menu-list">
                <li><a href="./home.html" class="menu-item home" aria-label="Página inicial"><img src="../img/home.svg"
                            alt="""></a></li>
                <li><a href=" ./books.html" class="menu-item text">Livros</a></li>
                <li><a href="./users.html" class="menu-item text">Alunos</a></li>
                <li><a href="#" class="menu-item exit">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="title">Cadastro de Alunos</h1>
        <h2 class="subtitle">Library Free</h2>
    </main>
    <section class="container">
        <form id="userRegisterForm" class="book-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" placeholder="Nome" required>
                </div>
                <div class="form-group form-group-small">
                    <label for="registration">Matricula</label>
                    <input type="text" id="registration" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required
                        placeholder="Matrícula (8 números)">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group form-group-medium">
                    <label for="course">Curso</label>
                    <input type="text" id="course" placeholder="Curso" required>
                </div>
                <div class="form-group form-group-small">
                    <label for="class">Turma</label>
                    <input type="text" id="class" placeholder="Turma" required>
                </div>
                <div class="form-group form-group-small">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" required
                        placeholder="Cpf (11 números)">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-positive">Salvar</button>
                <button type="button" class="btn-warning" onclick="window.history.back()">Cancelar</button>
            </div>
        </form>
    </section>
    <footer class="footer">
        <div class="copyright">
            <p>© Copyright - 2005</p>
            <p>Library Free - Open Source</p>
        </div>
    </footer>
</body>
<script type="module" src="../javascript/main.js"></script>
<script type="module" src="../javascript/pages/register-user.js"></script>

</html>
