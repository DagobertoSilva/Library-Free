<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Free | Alunos</title>
    <link rel="icon" href="../img/book.svg" type="image/svg+xml"">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel=" stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

    <style>
        /* Modal Customizado */
        .custom-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .custom-modal-box {
            background-color: white;
            border-radius: 0.5rem;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .custom-close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6c757d;
        }

        .custom-close-btn:hover {
            color: #212529;
        }
    </style></head>

<body>
    <header class="container">
        <nav>
            <ul class="menu-list">
                <li><a href=" ./books.html" class="menu-item text">Livros</a></li>
                <li><a href="./users.html" class="menu-item active text">Alunos</a></li>
                <li><a href="./emprestimos.html" class="menu-item text">Empréstimos</a></li>
                <li><a href="#" class="menu-item exit">Sair</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="title">Controle de Alunos</h1>
        <h2 class="subtitle">Library Free</h2>
    </main>
    <section class="container">
        <div class="row mb-4 align-items-end">
            <div class="col-md-3">
                <label for="course-select" class="form-label fw-bold">Curso:</label>
                <select id="course-select" class="form-select">
                    <option value="">Selecione um curso</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="class-select" class="form-label fw-bold">Turma:</label>
                <select id="class-select" class="form-select" disabled>
                    <option value="">Selecione uma turma</option>
                </select>
            </div>
        </div>
        <button class="btn-add" id="btn-add">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g clip-path="url(#clip0_146_439)">
                    <path
                        d="M7.99992 5.33331V10.6666M5.33325 7.99998H10.6666M14.6666 7.99998C14.6666 11.6819 11.6818 14.6666 7.99992 14.6666C4.31802 14.6666 1.33325 11.6819 1.33325 7.99998C1.33325 4.31808 4.31802 1.33331 7.99992 1.33331C11.6818 1.33331 14.6666 4.31808 14.6666 7.99998Z"
                        stroke="#02542D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </g>
                <defs>
                    <clipPath id="clip0_146_439">
                        <rect width="16" height="16" fill="white" />
                    </clipPath>
                </defs>
            </svg>
            <p>Novo</p>
        </button>
        <table class="table">
            <thead class="table-head">
                <tr>
                    <th>MATRÍCULA</th>
                    <th>NOME</th>
                    <th>CURSO</th>
                    <th>TURMA</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody class="table-body">
            </tbody>
        </table>
        <div class="pagination">
            <button id="btn-previous">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3.33325 8H12.6666M12.6666 8L7.99992 3.33334M12.6666 8L7.99992 12.6667" stroke="#1E1E1E"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p>Anterior</p>
            </button>
            </button>
            <span id="page-index"></span>
            <button id="btn-next">
                <p>Próximo</p>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3.33325 8H12.6666M12.6666 8L7.99992 3.33334M12.6666 8L7.99992 12.6667" stroke="#1E1E1E"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
        </div>
    </section>
    <div id="confirmModal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <button type="button" class="custom-close-btn" id="closeModalBtn">&times;</button>
            
            <h5 class="fw-bold mb-3" style="color: #000;">Deseja realmente apagar esse Aluno?</h5>
            <p id="confirmModalBody" class="text-secondary mb-4">Nome do Aluno Aqui</p>
            
            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn text-white px-4" style="background-color: #00C851;" id="confirmModalCancel">
                    Não
                </button>
                <button type="button" class="btn text-white px-4" style="background-color: #ff4444;" id="confirmModalConfirm">
                    Sim
                </button>
            </div>
        </div>
    </div>
    <footer class="footer">
        <div class="copyright">
            <p>© Copyright - 2005</p>
            <p>Library Free - Open Source</p>
        </div>
    </footer>
</body>
<script type="module" src="../javascript/main.js"></script>
<script type="module" src="../javascript/pages/users.js"></script>

</html>
